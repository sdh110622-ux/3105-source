name: Unzip to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unzip Source
        run: |
          echo "Unzipping..."
          unzip -q xdopshit.zip -d .
          echo "Removing unnecessary files..."
          rm -rf __MACOSX
          rm xdopshit.zip
          
      - name: Commit and Push Extracted Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extracted source files from zip and cleaned up"
          git push
