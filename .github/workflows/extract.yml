name: Unzip Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Source to Root
        run: |
          unzip -q xdopshit.zip -d .
          
      - name: List Files
        run: |
          echo "=== ROOT FOLDER CONTENTS ==="
          ls -la
          
          echo "=== ENGINE_CHEATBOT FOLDER CONTENTS ==="
          if [ -d "Engine_Cheatbot" ]; then
            ls -la Engine_Cheatbot
          else
            echo "Engine_Cheatbot folder root mein nahi hai!"
          fi
