name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Source
        run: |
          unzip -q xdopshit.zip -d extracted_source
          
      - name: Make build script executable & Run
        run: |
          # Zip ke andar jo Engine_Cheatbot folder hai, usme jao
          cd extracted_source/Engine_Cheatbot
          
          # Script ko run karo
          chmod +x build.sh
          ./build.sh

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: cheatbotowner-dylib
          # Dhyan do: build.sh ke andar jo output path likha hai, wo ab is folder ke andar banega
          path: extracted_source/Engine_Cheatbot/build/Release-iphoneos/cheatbotowner.dylib
          if-no-files-found: error
