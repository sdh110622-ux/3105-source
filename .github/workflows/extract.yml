name: Extract Source

on: [push, workflow_dispatch]

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unzip and Push
        run: |
          # 1. Zip extract karo current folder mein (bina koi naya folder banaye)
          unzip -o "3.1_IOSEngine_Cheatbot_Bgmi&Pubgm.zip"
          
          # 2. Faltu Mac ka folder delete karo
          rm -rf __MACOSX
          
          # 3. GitHub pe upload karo
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Source extracted successfully" || echo "No changes"
          git push
