name: Extract Source to Repo

on: [push, workflow_dispatch]

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unzip Source & Clean
        run: |
          # Zip extract kar rahe hain
          unzip "3.1_IOSEngine_Cheatbot_Bgmi&Pubgm.zip" -d MyExtractedSource
          
          # Mac ka kachra delete kar rahe hain
          cd MyExtractedSource
          rm -rf __MACOSX
          find . -name ".DS_Store" -type f -delete
          cd ..
          
          echo "Extraction aur cleaning complete!"

      - name: Push to Repo
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add MyExtractedSource
          git commit -m "Extracted clean source code" || echo "Kuch naya nahi mila"
          git push
