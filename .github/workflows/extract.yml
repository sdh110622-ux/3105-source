name: Extract Source to Repo

on: [push, workflow_dispatch]

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unzip Source
        run: |
          # Tere zip ka exact naam, quotes ke sath taaki & ka error na aaye
          unzip "3.1_IOSEngine_Cheatbot_Bgmi&Pubgm.zip" -d MyExtractedSource
          echo "Zip extracted successfully!"

      - name: Push to Repo
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add MyExtractedSource
          git commit -m "Extracted source code from zip" || echo "Kuch naya nahi mila"
          git push
