name: Fast Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v3
        with:
          path: $HOME/theos
          key: ${{ runner.os }}-theos-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-theos-

      - name: Setup Theos and Ldid
        run: |
          export THEOS=$HOME/theos
          if [ ! -d "$THEOS" ]; then
            git clone --recursive https://github.com/theos/theos.git $THEOS
          fi
          brew install ldid
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build Dylib
        run: |
          cd Engine_Cheatbot
          make package -j$(sysctl -n hw.ncpu)

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: cheatbotowner-dylib
          path: Engine_Cheatbot/.theos/obj/cheatbotowner.dylib
          if-no-files-found: error
