name: Universal Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v3
        with:
          path: $HOME/theos
          key: ${{ runner.os }}-theos-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-theos-

      - name: Setup Theos and Ldid
        run: |
          export THEOS=$HOME/theos
          if [ ! -d "$THEOS" ]; then
            git clone --recursive https://github.com/theos/theos.git $THEOS
          fi
          brew install ldid
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build Package
        run: |
          cd Engine_Cheatbot
          make package

      - name: Upload Deb (Jailbreak)
        uses: actions/upload-artifact@v4
        with:
          name: cheatbot-deb-jailbreak
          path: Engine_Cheatbot/packages/*.deb
          if-no-files-found: error

      - name: Upload Dylib (Non-Jailbreak)
        uses: actions/upload-artifact@v4
        with:
          name: cheatbot-dylib-sideloadly
          path: Engine_Cheatbot/.theos/obj/cheatbotowner.dylib
          if-no-files-found: error
