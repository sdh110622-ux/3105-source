name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Source
        run: |
          echo "Extracting xdopshit.zip..."
          unzip xdopshit.zip
          echo "Extraction complete. Current directory contents:"
          ls -la

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Run Build Script
        run: ./build.sh

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: cheatbotowner-dylib
          path: build/Release-iphoneos/cheatbotowner.dylib
          if-no-files-found: error
