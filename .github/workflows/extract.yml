name: Build Theos Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build Tweak
        run: |
          cd Engine_Cheatbot
          make package

      - name: Find and Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: cheatbot-deb
          # Theos packages usually go to packages/ folder
          path: Engine_Cheatbot/packages/*.deb
          if-no-files-found: error
