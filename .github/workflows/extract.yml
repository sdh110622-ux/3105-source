name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Make build script executable & Run
        run: |
          cd Engine_Cheatbot
          chmod +x build.sh
          ./build.sh

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: cheatbotowner-dylib
          path: Engine_Cheatbot/build/Release-iphoneos/cheatbotowner.dylib
          if-no-files-found: error
