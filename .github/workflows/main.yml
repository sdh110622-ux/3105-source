name: Extract Source ZIP

on: [push, workflow_dispatch]

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Source
        run: |
          unzip "3.1_IOSEngine_Cheatbot_Bgmi&Pubgm.zip" -d MyNewESP
          echo "Extracted successfully!"
          ls -la MyNewESP

      - name: Upload Extracted Source
        uses: actions/upload-artifact@v4
        with:
          name: Extracted-Source-Zip
          path: MyNewESP/
